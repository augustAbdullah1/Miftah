name: Deploy Miftah App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build web app
      run: npm run build:web
      
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./web-build
        
  build-android:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Setup Expo and EAS
      uses: expo/expo-github-action@v8
      with:
        expo-version: latest
        eas-version: latest
        token: ${{ secrets.EXPO_TOKEN }}
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build Android APK
      run: eas build --platform android --profile production --non-interactive
      
    - name: Upload APK to Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          *.apk
        name: Miftah App v${{ github.ref_name }}
        body: |
          🚀 **Miftah App Release v${{ github.ref_name }}**
          
          ### 📱 Download Options:
          - **Android APK**: Download `miftah.apk` below
          - **Web App**: Visit [miftah-app.github.io](https://yourusername.github.io/miftah-marketplace)
          
          ### ✨ What's New:
          - Modern Glass morphism design
          - AI-powered marketplace features
          - Real-time messaging with voice notes
          - eBay-style auction system
          - Multi-language support (Arabic & English)
          - Advanced search and recommendations
          
          ### 🔧 Technical Details:
          - Built with React Native & Expo
          - Firebase backend
          - TypeScript for type safety
          - Responsive design for all devices
          
          ---
          
          **Full Changelog**: https://github.com/yourusername/miftah-marketplace/compare/v${{ github.event.before }}...v${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
  create-release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [deploy-web, build-android]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Get version from package.json
      id: package-version
      run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.package-version.outputs.version }}
        name: Miftah App v${{ steps.package-version.outputs.version }}
        body: |
          🎉 **Miftah - Your Key to Everything**
          
          A revolutionary marketplace app combining the best features of eBay, Facebook Marketplace, Amazon, and OLX with cutting-edge AI technology.
          
          ### 🌟 Key Features:
          - 🎨 Modern Glass morphism design
          - 🤖 AI-powered smart features
          - 💬 Real-time messaging with voice notes
          - 🎯 eBay-style auction system
          - 🌍 Multi-language support
          - 🔒 Advanced security & fraud detection
          
          ### 📱 Try it Now:
          - **Web App**: [Launch Miftah Web](https://yourusername.github.io/miftah-marketplace)
          - **Android**: Download APK below
          - **iOS**: Coming soon to App Store
          
          ### 🚀 Installation:
          1. Download `miftah.apk`
          2. Enable "Install from Unknown Sources" on Android
          3. Install and enjoy!
          
          ---
          Made with ❤️ by the Miftah Team
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}